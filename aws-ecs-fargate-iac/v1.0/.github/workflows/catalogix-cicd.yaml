# catalogix-cicd.yaml
# GitHub Actions workflow for Catalogix CI/CD pipeline

name: Catalogix CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "user-svc/**"
      - "product-svc/**"
      - "frontend-svc/**"
      - ".github/workflows/catalogix-cicd.yaml"
      - "pom.xml"
  workflow_run:
    workflows: ["Terraform Infrastructure"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: catalogix-main
  cancel-in-progress: true

permissions:
  id-token: write # Required for AWS authentication
  contents: read # Required to check out code
  pull-requests: write # Required for SonarCloud to post comments on PRs

env:
  AWS_REGION: ap-south-1
  APP_NAME: catalogix
  MAJOR_VERSION: "1.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# PHASE 0 — PIPELINE CONTEXT (RUNS ONCE)

jobs:
  context:
    name: Phase 0 - Pipeline Context🧩
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Generate image tag
        id: tag
        run: |
          IMAGE_TAG="${{ env.MAJOR_VERSION }}-${{ github.run_number }}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $IMAGE_TAG"
  
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    needs: context

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            zricethezav/gitleaks:v8.21.2 detect \
              --source /repo \
              --exit-code 1 \
              --redact

# PHASE 1 — BUILD & TEST
# PHASE 1A — FRONTEND BUILD

  build-frontend-svcs:
    name: "Phase 1A - Build Frontend🧪"
    runs-on: ubuntu-22.04
    needs: [context, secret-scan]

    strategy:
      fail-fast: true
      matrix:
        service: [frontend-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Build Service - ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          npm ci
          npm run build

# PHASE 1B — BACKEND BUILD & TEST

  build-backend-svcs:
    name: Phase 1B - Build & Test Backend 🧪
    runs-on: ubuntu-22.04
    needs: [context, secret-scan]

    strategy:
      fail-fast: true
      matrix:
        service: [user-svc, product-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test - ${{ matrix.service }}
        run: |
          mvn -B install -N --file pom.xml 
          mvn -B -f ${{ matrix.service }}/pom.xml clean verify

# PHASE 2 — DOCKER OPERATIONS (BUILD, SCAN, PUSH)

  docker-ops:
    name: Phase 2 - Image Build, Security Scan, Image Push 🐳
    runs-on: ubuntu-latest
    needs: 
      - context
      - build-backend-svcs
      - build-frontend-svcs
      
    strategy:
      matrix:
        service: [user-svc, product-svc, frontend-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build Docker image - ${{ matrix.service }}
        run: |
          # Backend services need root context (Dockerfiles reference parent pom + service subdirs)
          # Frontend uses its own dir as context
          if [[ "${{ matrix.service }}" == "frontend-svc" ]]; then
            CONTEXT="./${{ matrix.service }}"
            DOCKERFILE="./${{ matrix.service }}/Dockerfile"
          else
            CONTEXT="."
            DOCKERFILE="./${{ matrix.service }}/Dockerfile"
          fi

          docker build --pull \
            --cache-from ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}-${{ matrix.service }}:cache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}-${{ matrix.service }}:${{ needs.context.outputs.image_tag }} \
            -f $DOCKERFILE \
            $CONTEXT
      
      - name: Trivy Security Scan - ${{ matrix.service }}
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}-${{ matrix.service }}:${{ needs.context.outputs.image_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          vuln-type: os,library

      - name: Push image to ECR - ${{ matrix.service }}
        run: |
          docker push \
            ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}-${{ matrix.service }}:${{ needs.context.outputs.image_tag }}

# PHASE 3 — DEPLOY TO ECS

  deploy:
    name:  Phase 3 - Deploy to ECS 🚀
    runs-on: ubuntu-latest
    needs: 
      - docker-ops
      - context

    strategy:
      matrix:
        service: [user-svc, product-svc, frontend-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Download current Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.APP_NAME }}-${{ matrix.service }} \
            --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.4
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.service }} # Match your container name in ECS
          image: ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}-${{ matrix.service }}:${{ needs.context.outputs.image_tag }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ env.APP_NAME }}-cluster
          wait-for-service-stability: true

# FINAL — PIPELINE RESULT

  pipeline-summary:
    name: Final Pipeline Summary 📊
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secret-scan
      - build-backend-svcs
      - build-frontend-svcs
      - docker-ops
      - deploy

    steps:
      - run: |
          echo "================ Pipeline Summary ================"

          echo "  - Secret Scan     : ${{ needs.secret-scan.result }}"
          "${{ needs.secret-scan.result }}" != "success" ||

          echo ""
          echo "Frontend Services:"
          echo " - frontend-svc     : ${{ needs.build-frontend-svcs.result }}"

          echo ""
          echo "Backend Services:"
          echo " - user-svc         : ${{ needs.build-backend-svcs.result }}"
          echo " - product-svc      : ${{ needs.build-backend-svcs.result }}"

          echo ""
          echo "Docker Operations:"
          echo " - Build/Scan/Push  : ${{ needs.docker-ops.result }}"

          echo ""
          echo "Deployment:"
          echo " - Deploy to ECS    : ${{ needs.deploy.result }}"

          echo ""
          echo "=================================================="

          if [[ \
            "${{ needs.build-frontend-svcs.result }}" != "success" || \
            "${{ needs.build-backend-svcs.result }}" != "success" || \
            "${{ needs.docker-ops.result }}" != "success" || \
            "${{ needs.deploy.result }}" != "success" \
          ]]; then
            echo "Catalogix pipeline FAILED ❌"
            exit 1
          else
            echo "Catalogix pipeline SUCCESS ✅"
          fi