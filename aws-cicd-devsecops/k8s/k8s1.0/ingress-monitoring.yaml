# MONITORING INGRESS — internal ALB for Grafana, Prometheus, and Alertmanager.
#
# scheme: internal — this ALB is ONLY accessible from within the VPC.
# This is intentional: monitoring UIs should never be publicly reachable.
#
# For dev access without DNS, use port-forward:
#   kubectl port-forward svc/monitoring-grafana 3000:3000 -n monitoring
#   kubectl port-forward svc/monitoring-kube-prometheus-stack-prometheus 9090:9090 -n monitoring
#   kubectl port-forward svc/monitoring-kube-prometheus-stack-alertmanager 9093:9093 -n monitoring
#
# For production hostname access:
#   1. Create a Route53 private hosted zone for your VPC (e.g. internal.catalogix.com)
#   2. Add A alias records pointing to this internal ALB
#   3. Optionally install External DNS to automate record creation
#
# NOTE on service names: These names are determined by the kube-prometheus-stack
# Helm release name. If you named the release something other than "monitoring",
# update the service names below accordingly:
#   <release-name>-grafana
#   <release-name>-kube-prometheus-stack-prometheus
#   <release-name>-kube-prometheus-stack-alertmanager
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/group.name: monitoring
spec:
  ingressClassName: alb
  rules:
    - host: grafana.internal.catalogix.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 3000

    - host: prometheus.internal.catalogix.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-stack-prometheus
                port:
                  number: 9090

    - host: alertmanager.internal.catalogix.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-stack-alertmanager
                port:
                  number: 9093