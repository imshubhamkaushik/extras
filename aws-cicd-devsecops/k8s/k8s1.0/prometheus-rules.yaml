# PROMETHEUS RULES — custom alert rules for catalogix services.
# In kube-prometheus-stack these were defined under additionalPrometheusRulesMap.
# As a plain manifest, they become a PrometheusRule CRD resource.
#
# PREREQUISITE: Prometheus Operator (part of kube-prometheus-stack) must be installed.
#
# Three alert groups:
#   1. service-availability — fires if any catalogix Deployment has 0 available replicas for 3m
#   2. error-rate           — fires if 5xx rate > 5% of total traffic for 5m (critical)
#   3. high-latency         — fires if p95 latency > 1.5s for 5m (warning)
#
# NOTE on inhibit rules: The AlertManager inhibit rules (suppress HighErrorRate and
# HighLatencyP95 when ServiceUnavailable fires) live in the AlertManager config,
# not here. They are part of the kube-prometheus-stack Helm values and must be
# configured there or via an AlertManagerConfig CRD if managing AlertManager separately.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: catalogix-alerts
  namespace: catalogix
spec:
  groups:
    - name: service-availability
      rules:
        - alert: ServiceUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="catalogix"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{ $labels.deployment }} has no available replicas"
            description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has had 0 available replicas for more than 3 minutes."

    - name: error-rate
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum by (namespace) (
                rate(http_server_requests_seconds_count{status=~"5..",namespace="catalogix"}[5m])
              )
              /
              sum by (namespace) (
                rate(http_server_requests_seconds_count{namespace="catalogix"}[5m])
              )
            ) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate in {{ $labels.namespace }}"
            description: "5xx responses exceed 5% of total traffic in namespace {{ $labels.namespace }} for more than 5 minutes."

    - name: high-latency
      rules:
        - alert: HighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, job) (
                rate(http_server_requests_seconds_bucket{namespace="catalogix"}[5m])
              )
            ) > 1.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High p95 latency for {{ $labels.job }}"
            description: "95th percentile latency for {{ $labels.job }} exceeds 1.5s for more than 5 minutes."