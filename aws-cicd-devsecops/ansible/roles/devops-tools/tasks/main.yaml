---
# Tasks for installing DevOps tools like AWS CLI, kubectl, Helm, and Trivy
# Versions of tools are defined in ansible/group_vars/all.yaml for easy maintenance. Ensure that the EC2 instances have access to the internet to download these tools

- name: Check AWS CLI installation
  command: aws --version
  register: aws_cli_check
  changed_when: false
  failed_when: false

- name: Download AWS CLI installer
  get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
    mode: '0644'
  when: aws_cli_check.rc != 0

- name: Unzip AWS CLI installer
  unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: yes
  when: aws_cli_check.rc != 0

- name: Install AWS CLI
  command: /tmp/aws/install
  when: aws_cli_check.rc != 0

# Kubernetes CLI (kubectl)
- name: Install kubectl
  get_url:
    url: https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: '0755'
    force: false

# Helm
- name: Download Helm
  get_url:
    url: https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz
    dest: /tmp/helm.tar.gz
    force: false

- name: Extract Helm
  unarchive:
    src: /tmp/helm.tar.gz
    dest: /tmp
    remote_src: yes

- name: Install Helm binary to /usr/local/bin
  copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: '0755'
    remote_src: yes

# Trivy
- name: Download Trivy {{ trivy_version }} .deb package
  get_url:
    url: https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/trivy_{{ trivy_version }}_Linux-64bit.deb
    dest: /tmp/trivy.deb
    force: false

- name: Install Trivy from .deb package
  apt:
    deb: /tmp/trivy.deb